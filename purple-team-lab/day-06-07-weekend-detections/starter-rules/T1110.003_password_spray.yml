title: Password Spray Attack (Many Failed Logons, Same Source)
id: a1b2c3d4-purple-lab-004
status: experimental
description: |
    Detects password spraying — a single source attempting to authenticate as
    many distinct users with shared/common passwords. Avoids account lockout
    by trying ONE password against MANY users.
    
    NOTE: Sigma's stateless model can't natively express "many failures across
    users from same source within X seconds." This rule fires on individual
    failed logons; the Wazuh version uses frequency rules to correlate.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: Rohan / Purple Lab
date: 2026-04-25
tags:
    - attack.credential_access
    - attack.t1110.003
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
        LogonType:
            - '3'   # Network logon
            - '8'   # NetworkCleartext
            - '10'  # RemoteInteractive
        SubStatus: '0xc000006a'   # Bad password (not bad username)
    condition: selection
falsepositives:
    - User mistyping password
    - Service account with stale credentials
    - Mobile devices with cached old passwords
level: medium   # Single event = medium; correlation rule will elevate to high
