title: AS-REP Roasting (Pre-Authentication Disabled)
id: a1b2c3d4-purple-lab-002
status: experimental
description: |
    Detects AS-REP Roasting attacks. Event ID 4768 with PreAuthType 0 indicates
    a TGT was issued to an account with Kerberos pre-authentication disabled,
    which exposes the password hash to offline cracking.
references:
    - https://attack.mitre.org/techniques/T1558/004/
author: Rohan / Purple Lab
date: 2026-04-25
tags:
    - attack.credential_access
    - attack.t1558.004
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4768
        PreAuthType: '0'
    filter_machine_accounts:
        TargetUserName|endswith: '$'
    condition: selection and not filter_machine_accounts
falsepositives:
    - Legacy applications requiring DES/no preauth
    - Smart card logon (rare cases)
level: high
